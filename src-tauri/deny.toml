# cargo-deny: license policy for the public melori build (scripts/prepublish_audit.py).
# Permissive and weak-copyleft (file-level) licenses only; GPL/AGPL/LGPL/SSPL fail the audit.
[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
confidence-threshold = 0.9
