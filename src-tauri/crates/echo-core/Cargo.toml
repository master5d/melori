[package]
name = "echo-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
echo-config = { path = "../echo-config" }
echo-text = { path = "../echo-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
anyhow = "1.0.95"
log = "0.4.25"
tokio = "1.43.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tar = "0.4.44"
flate2 = "1.0"
bzip2 = "0.4"
sha2 = "0.10"
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp", "onnx"] }
# Same version as the app crate; the workspace-root [patch.crates-io] pin to
# the master5d/speakrs progress fork applies here too.
speakrs = { version = "0.4.2", optional = true }

[target.'cfg(windows)'.dependencies]
transcribe-rs = { version = "0.3.8", features = ["whisper-vulkan", "ort-directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { version = "0.3.8", features = ["whisper-metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
transcribe-rs = { version = "0.3.8", features = ["whisper-vulkan"] }

[features]
diarization = ["dep:speakrs"]

[dev-dependencies]
tempfile = "3"
