[package]
name = "echo-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
echo-config = { path = "../echo-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
anyhow = "1.0.95"
log = "0.4.25"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1.43.0", features = ["process", "io-util", "time", "rt"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread"] }
