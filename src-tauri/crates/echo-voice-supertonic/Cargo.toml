[package]
name = "echo-voice-supertonic"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
echo-voice = { path = "../echo-voice" }
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
unicode-normalization = "0.1"
log = "0.4"
